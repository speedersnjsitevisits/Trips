<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2242">
<meta name="robots" content="noindex">
<title>Your Trip · Anchor And Wand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: a luxury advisor's private trip book, warm and calm
   IDEA: her business card comes to life, then opens into the trip
   PICTURE: the card front, then a gold countdown on navy
   COLOUR and TYPE: card navy, foil gold, ivory pages; Allura script, Cormorant Garamond, Jost
   LAYOUT: navy header + tabs, one column of ivory cards, 44px targets, phone first */
:root{color-scheme:light dark;
--navy:#1e2242;--navy2:#151831;--gold:#d8b96c;--gold2:#f0dfaa;
--bg:light-dark(#f6f2ea,#11142a);--card:light-dark(#ffffff,#1b1f3b);--ink:light-dark(#1e2242,#f1ece0);
--mute:light-dark(#6c6a78,#a9a6b8);--line:light-dark(#e6dfd0,#2c3155);--goldInk:light-dark(#8a6a1f,#e2c47c)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Jost,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
.script{font-family:Allura,cursive;font-weight:400}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.foil{background:linear-gradient(100deg,#b8934a,var(--gold2) 45%,#c9a456 70%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
/* intro */
#intro{position:fixed;inset:0;z-index:20;background:radial-gradient(120% 80% at 50% 30%,#262b52,var(--navy2));display:grid;place-items:center;padding:24px;transition:opacity 1.8s ease}
#intro.out{opacity:0;pointer-events:none}
.bcard{position:relative;width:min(440px,92vw);aspect-ratio:1.75;border-radius:22px;background:linear-gradient(160deg,#272c52,#1c2040);box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 0 0 1px rgba(216,185,108,.25);display:grid;place-items:center;overflow:hidden;opacity:0;transform:translateY(14px) scale(.97);transition:opacity 1.6s ease,transform 1.8s ease}
.bcard.in{opacity:1;transform:none}
.mono{position:absolute;inset:0;display:grid;place-items:center;font:600 min(46vw,200px)/1 'Cormorant Garamond',serif;color:rgba(0,0,0,.18);letter-spacing:-.04em;user-select:none}
.bname{position:relative;font-size:clamp(34px,9vw,50px);line-height:1;text-align:center;padding:0 12px}
.under{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:12px auto 0;transition:width 2s ease .8s}
.bcard.in .under{width:60%}
.welcome{margin-top:26px;text-align:center;color:var(--gold2);opacity:0;transition:opacity 1.6s ease;min-height:60px}
.welcome.in{opacity:1}
.welcome .serif{font-size:26px;line-height:1.2}
.welcome small{display:block;letter-spacing:.04em;color:#c9c4d9;font-size:14px;margin-top:4px}
.pinbox{display:flex;gap:8px;justify-content:center;margin-top:14px}
.pinbox input{width:150px;text-align:center;font-size:22px;letter-spacing:.3em;background:rgba(255,255,255,.08);border:1px solid rgba(216,185,108,.5);border-radius:12px;color:#fff;min-height:48px}
.gbtn{background:linear-gradient(120deg,#c7a35a,var(--gold2));color:#1e2242;border:0;border-radius:12px;min-height:48px;padding:0 18px;font-weight:500}
.err{color:#ffb4a8;font-size:14px;margin-top:8px}
.skip{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#8f8ba6;font-size:13px}
/* app */
header{background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top)}
.wrap{max-width:860px;margin:0 auto;padding:0 max(4vw,16px)}
.bar{display:flex;align-items:center;gap:10px;padding:14px 0 4px}
.bar .script{font-size:28px;flex:1;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(216,185,108,.45);color:var(--gold2);border-radius:999px;min-height:40px;padding:0 14px;text-decoration:none;font-size:14px;background:none}
.hero{padding:16px 0 18px}
.hero h1{margin:0;font:600 clamp(32px,7vw,48px)/1.05 'Cormorant Garamond',serif;text-wrap:balance}
.hero p{margin:6px 0 0;color:#c9c4d9}
nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:5;background:var(--navy)}
nav::-webkit-scrollbar{display:none}
nav a{padding:13px 12px;white-space:nowrap;text-decoration:none;color:#c9c4d9;border-bottom:2px solid transparent;font-weight:500}
nav a.on{color:var(--gold2);border-color:var(--gold)}
main.wrap{padding-top:20px;padding-bottom:90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
h2{font:600 26px/1.15 'Cormorant Garamond',serif;margin:0 0 10px}
h3{font:600 20px/1.2 'Cormorant Garamond',serif;margin:18px 0 6px}
.mute{color:var(--mute)}.sm{font-size:14px}
/* countdown */
.cdwrap{background:var(--navy);color:#fff;border:0;text-align:center;padding:26px 14px}
.cdl{color:#c9c4d9;letter-spacing:.04em}
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px auto 8px;max-width:520px}
.cd b{display:block;font:600 clamp(40px,12vw,74px)/1 'Cormorant Garamond',serif;font-variant-numeric:lining-nums tabular-nums}
.cd span{font-size:13px;color:#c9c4d9}
.big{font:600 clamp(44px,12vw,72px)/1 'Cormorant Garamond',serif;font-variant-numeric:lining-nums}
.note{white-space:pre-wrap}
.sig{font-size:40px;line-height:1;margin-top:6px}
/* crew */
.tl{display:grid;gap:5px 3px;align-items:center;margin-top:8px}
.tl .lab{grid-column:1;font-size:13px;line-height:1.2;overflow:hidden}.tl .lab small{display:block;color:var(--mute)}
.tl .dh{text-align:center;font-size:12px;color:var(--mute)}
.tl .seg{height:26px;border-radius:7px;background:linear-gradient(120deg,#b8934a,var(--gold2))}
.tl .seg.s2{background:linear-gradient(120deg,#3b4380,#6470b8)}.tl .seg.s3{background:linear-gradient(120deg,#8a5a7a,#c58fae)}.tl .seg.s4{background:linear-gradient(120deg,#3c7d77,#78b8ae)}
.tl .tot{text-align:center;font-weight:500;border-top:1px solid var(--ink);padding-top:4px}
/* advisor */
.adv{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.adv .av{width:56px;height:56px;border-radius:50%;background:var(--navy);display:grid;place-items:center;flex:none;border:1px solid var(--gold)}
.adv .av span{font:600 22px 'Cormorant Garamond',serif}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-weight:500}
.stars{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
.stars button{background:none;border:0;padding:0;width:48px;height:48px;font-size:40px;line-height:1;color:rgba(216,185,108,.35);transition:transform .15s}
.stars button.on{color:var(--gold)}
.stars button:active{transform:scale(.9)}
.rvf textarea,.rvf input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font-size:16px;min-height:48px}
.rvf textarea{min-height:120px;resize:vertical}
.rvf label{display:grid;gap:6px;margin-top:12px;font-size:14px;color:var(--mute)}
.quote{font:500 21px/1.4 'Cormorant Garamond',serif;white-space:pre-wrap}
.btn.gold{background:linear-gradient(120deg,#c7a35a,var(--gold2));color:#1e2242;border:0}
/* itinerary & bookings */
.day.today{outline:2px solid var(--gold)}
.dhd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border-radius:999px;padding:2px 10px;font-size:13px;background:var(--bg);border:1px solid var(--line)}
.plan{list-style:none;margin:8px 0 0;padding:0}
.plan li{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.plan .t{width:76px;flex:none;color:var(--goldInk);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.bk{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px}
.ic{width:44px;height:44px;border-radius:12px;background:var(--navy);display:grid;place-items:center}
.ic svg{width:22px;height:22px;stroke:var(--gold2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.conf{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;background:var(--bg);border-radius:12px;padding:8px 12px}
.conf b{font-size:19px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.conf button{margin-left:auto;min-height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:14px}
.lk{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:15px}
/* packing */
.prog{height:8px;border-radius:8px;background:var(--bg);overflow:hidden;margin:8px 0 2px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#b8934a,var(--gold2));transition:width .3s}
.pk{list-style:none;margin:0;padding:0}
.pk label{display:flex;gap:12px;align-items:center;min-height:48px;border-top:1px solid var(--line);cursor:pointer}
.pk input{width:22px;height:22px;accent-color:#b8934a;flex:none}
.pk .done{color:var(--mute);text-decoration:line-through}
/* weather */
.wx{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.wx .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rng{position:relative;height:8px;border-radius:8px;background:var(--bg)}.rng i{position:absolute;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,#6e8fd0,var(--gold),#d9805a)}
.demo{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:999px;padding:6px;display:flex;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:8;font-size:13px;align-items:center}
.demo span{padding:0 8px;color:#c9c4d9}
.demo button{background:none;border:0;border-radius:999px;min-height:34px;padding:0 12px;color:#fff}
.demo button.on{background:var(--gold);color:var(--navy)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media(max-width:520px){.tl .lab{font-size:11px}.cd b{font-size:40px}}
@media(prefers-reduced-motion:reduce){.bcard{transform:none!important}.prog i{transition:none}}
</style>
<script src="config.js"></script>
<script src="shared.js"></script>
</head>
<body>
<div id="intro" role="dialog" aria-label="Welcome">
  <div>
    <div class="bcard" id="bcard">
      <div class="mono" id="mono">NH</div>
      <div><div class="bname script foil" id="bname">Anchor And Wand Travel</div><div class="under"></div></div>
    </div>
    <div class="welcome" id="welcome"></div>
  </div>
  <div class="skip" id="skip">Tap anywhere to continue</div>
</div>

<div id="app" hidden>
  <header>
    <div class="wrap">
      <div class="bar"><div class="script foil" id="brand">Anchor And Wand Travel</div><a class="pill" id="callTop" href="#">Message Nicole</a></div>
      <div class="hero"><h1 id="title">Your trip</h1><p id="sub"></p></div>
    </div>
    <nav class="wrap" id="tabs"></nav>
  </header>
  <main class="wrap" id="main"></main>
</div>
<div class="demo" id="demo" hidden></div>

<script>
{
const {C,esc,num,parseD,iso,dayDate,fmt,t12,byTime,BTYPES,sampleTrip,api,apiGet,ls}=window.AW;
const A=C.advisor||{};
const $=s=>document.querySelector(s);
const q=new URLSearchParams(location.search);
const id=q.get('t')||'';
const DEMO=!C.API_URL||!id||id==='demo';
let trip=null, ticks={}, myReview=null, draftStars=0, pin='', view='overview', forced=null, cdTimer=null, wxCache={};

/* ---------- intro ---------- */
$('#mono').textContent=A.monogram||'NH';
const intro=$('#intro'), card=$('#bcard'), wel=$('#welcome');
let introDone=false, introReady=false;
let began=0, pendingTrip=null;
function begin(){ if(began)return; began=Date.now(); card.classList.add('in'); if(pendingTrip){const t=pendingTrip;pendingTrip=null;playWelcome(t)} }
/* wait for the script font (max 1.5s) so the card never animates in an unstyled font */
const fontsOk=document.fonts&&document.fonts.load?Promise.race([Promise.all([document.fonts.load('40px Allura'),document.fonts.load('600 40px "Cormorant Garamond"')]),new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
fontsOk.then(()=>setTimeout(()=>requestAnimationFrame(()=>requestAnimationFrame(begin)),150),()=>begin());
function welcomeText(t){return `<div class="serif">Welcome, ${esc(t.client||'friends')}</div><small>${esc(t.title||'')}${t.start?' · '+fmt(parseD(t.start),{month:'long',day:'numeric',year:'numeric'}):''}</small>`}
function finishIntro(){
  if(introDone||!introReady)return;introDone=true;
  intro.classList.add('out');$('#app').hidden=false;
  setTimeout(()=>{intro.remove()},1900);
}
intro.addEventListener('click',e=>{if(e.target.closest('.pinbox'))return;finishIntro()});
function playWelcome(t){
  if(!began){pendingTrip=t;return}
  introReady=true;
  const seen=ls.get('aw-seen-'+(t.id||id));ls.set('aw-seen-'+(t.id||id),1);
  const total=seen?5000:8500;                 /* how long the opening stays up */
  const since=Date.now()-began;
  setTimeout(()=>{wel.innerHTML=welcomeText(t);requestAnimationFrame(()=>requestAnimationFrame(()=>wel.classList.add('in')))},Math.max(0,1600-since));
  setTimeout(finishIntro,Math.max(total-since,3500));
}
function askPin(msg){
  $('#skip').textContent='';
  wel.innerHTML=`<div class="serif">Welcome</div><small>Enter the family code from your advisor</small>
  <form class="pinbox" id="pinf"><input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" aria-label="Family code" required><button class="gbtn">Open</button></form>${msg?`<div class="err">${esc(msg)}</div>`:''}`;
  wel.classList.add('in');
  $('#pinf').addEventListener('submit',e=>{e.preventDefault();pin=$('#pin').value.trim();load()});
  setTimeout(()=>$('#pin')&&$('#pin').focus(),300);
}

/* ---------- data ---------- */
async function load(){
  if(DEMO){const all=ls.get('aw-demo-trips')||{};trip=(id&&all[id])||(all.demo)||sampleTrip();ticks=ls.get('aw-ticks-'+(trip.id||'demo'))||{};myReview=ls.get('aw-review-'+(trip.id||'demo'));start();return}
  pin=pin||ls.get('aw-pin-'+id)||'';
  if(!pin){askPin();return}
  try{
    const j=await apiGet({action:'trip',id,pin});
    if(!j.ok){ if(j.error==='pin'){ls.del('aw-pin-'+id);pin='';askPin('That code didn’t match. Check the message from your advisor.')} else {wel.innerHTML=`<div class="serif">We couldn’t find this trip</div><small>Please use the link your advisor sent you.</small>`;wel.classList.add('in')} return}
    ls.set('aw-pin-'+id,pin);trip=j.trip;ticks=j.ticks||{};myReview=j.review||null;start();
  }catch(e){
    const cached=ls.get('aw-trip-'+id);
    if(cached){trip=cached;ticks=ls.get('aw-ticks-'+id)||{};start(true);return}
    wel.innerHTML=`<div class="serif">You’re offline</div><small>Connect to the internet and refresh this page.</small>`;wel.classList.add('in');
  }
}
function start(offline){
  if(!DEMO){ls.set('aw-trip-'+id,trip);ls.set('aw-ticks-'+id,ticks)}
  document.title=`${trip.title||'Your trip'} · Anchor And Wand`;
  $('#skip').textContent='Tap anywhere to continue';
  playWelcome(trip);
  view=(location.hash||'#overview').slice(1);
  render();
  if(offline)$('#main').insertAdjacentHTML('afterbegin','<div class="card sm mute">Showing the last saved copy. Some details may be out of date.</div>');
  if(DEMO)demoBar();
}

/* ---------- time ---------- */
function bounds(t){
  const s=parseD(t.start);if(!s)return null;
  const fl=(t.bookings||[]).filter(b=>b.type==='flight'&&num(b.from,0)===1&&b.time).sort(byTime)[0];
  const startAt=new Date(s);if(fl){const [h,m]=fl.time.split(':').map(Number);startAt.setHours(h,m||0)}
  const end=new Date(s);end.setDate(end.getDate()+num(t.days,1));
  return {s,startAt,end};
}
function phase(t){
  if(forced)return forced;
  const b=bounds(t);if(!b)return 'before';const now=new Date();
  return now<b.s?'before':now<b.end?'during':'after';
}
function todayN(t){
  if(forced==='during')return Math.min(3,num(t.days,1));
  const b=bounds(t);if(!b)return 0;const n=Math.floor((new Date()-b.s)/864e5)+1;return n>=1&&n<=num(t.days,1)?n:0;
}

/* ---------- render ---------- */
const TABS=[['overview','Overview','bda'],['itinerary','Itinerary','bda'],['travel','Travel','bda'],['packing','Packing','bd'],['weather','Weather','bd'],['review','Review','a']];
function render(){
  const t=trip, ph=phase(t);
  $('#title').textContent=t.title||'Your trip';
  const s=parseD(t.start), e=dayDate(t,num(t.days,1));
  $('#sub').textContent=[t.client,s?`${fmt(s,{month:'short',day:'numeric'})} – ${fmt(e,{month:'short',day:'numeric',year:'numeric'})}`:'',t.dest].filter(Boolean).join(' · ');
  $('#callTop').href=A.whatsapp?`https://wa.me/${A.whatsapp}`:`sms:${A.phone||''}`;
  $('#callTop').textContent=`Message ${(A.name||'your advisor').split(' ')[0]}`;
  const tabs=TABS.filter(x=>x[2].includes(ph[0]));
  if(!tabs.some(([k])=>k===view))view='overview';
  $('#tabs').innerHTML=tabs.map(([k,n])=>`<a href="#${k}" class="${k===view?'on':''}">${n}</a>`).join('');
  const V={overview,itinerary,travel,packing,weather,review};
  $('#main').innerHTML=V[view](t,ph);
  clearInterval(cdTimer);
  if(view==='overview'&&ph==='before'){tick();cdTimer=setInterval(tick,1000)}
  if(view==='weather')loadWeather(t);
}
function tick(){
  const el=$('#cd');if(!el)return;const b=bounds(trip);if(!b)return;
  let d=Math.max(0,b.startAt-new Date());
  if(forced==='before'&&d<=0)d=47*864e5;
  const D=Math.floor(d/864e5),H=Math.floor(d/36e5)%24,M=Math.floor(d/6e4)%60,S=Math.floor(d/1e3)%60;
  el.innerHTML=[[D,'days'],[H,'hours'],[M,'minutes'],[S,'seconds']].map(([v,l])=>`<div><b class="foil">${String(v).padStart(l==='days'?1:2,'0')}</b><span>${l}</span></div>`).join('');
}
const advisorCard=()=>{
  const ini=(A.name||'NH').split(' ').map(w=>w[0]).join('').slice(0,2);
  return `<div class="card"><div class="adv"><div class="av"><span class="foil">${esc(ini)}</span></div><div><div class="serif" style="font-size:22px;font-weight:600;line-height:1.1">${esc(A.name)}</div><div class="mute sm">${esc(A.title)} · ${esc(A.business)}</div></div></div>
  <div class="btns">${A.whatsapp?`<a class="btn gold" href="https://wa.me/${esc(A.whatsapp)}">WhatsApp</a>`:''}${A.phone?`<a class="btn" href="sms:${esc(A.phone)}">Text</a><a class="btn" href="tel:${esc(A.phone)}">Call</a>`:''}${A.email?`<a class="btn" href="mailto:${esc(A.email)}">Email</a>`:''}</div>
  <p class="sm mute" style="margin:10px 0 0">${esc(A.phone||'')}${A.phone&&A.email?' · ':''}${esc(A.email||'')}</p></div>`;
};

function overview(t,ph){
  let h='';
  if(ph==='before'){
    const b=bounds(t);
    h+=`<div class="card cdwrap"><div class="cdl">${b?'Your trip begins in':'Dates coming soon'}</div>${b?`<div class="cd" id="cd"></div><div class="sm" style="color:#c9c4d9">${fmt(b.startAt,{weekday:'long',month:'long',day:'numeric'})}</div>`:''}</div>`;
  }else if(ph==='during'){
    const n=todayN(t)||1, items=((t.plan||{})[n]||[]).slice().sort(byTime), stay=stayOn(t,n);
    h+=`<div class="card cdwrap"><div class="cdl">Today</div><div class="big foil">Day ${n} of ${t.days}</div><div class="sm" style="color:#c9c4d9;margin-top:6px">${fmt(dayDate(t,n),{weekday:'long',month:'long',day:'numeric'})}</div></div>
    <div class="card"><h2>Today’s plan</h2>${items.length?`<ul class="plan">${items.map(i=>`<li><span class="t">${t12(i.time)||'Any time'}</span><span>${esc(i.text)}</span></li>`).join('')}</ul>`:'<p class="mute">A free day. Enjoy it.</p>'}${stay&&n<t.days?`<p class="sm mute">Tonight: ${esc(stay.title)}</p>`:''}</div>`;
  }else{
    h+=`<div class="card cdwrap"><div class="big foil">Welcome home</div><p style="color:#c9c4d9;margin:10px 0 0">We hope ${esc(t.title||'the trip')} was everything you dreamed of.</p><div class="btns" style="justify-content:center"><a class="btn gold" href="#review">${myReview?'See your review':'Share how it went'}</a></div></div>`;
  }
  const DEF={during:`Have the best time today! If anything comes up, big or small, I\u2019m just a message away.`,
    after:`Welcome home! Thank you for trusting me with ${t.title||'this trip'}. I hope it was everything you dreamed of. I\u2019d love to hear all about it, and I\u2019m here whenever you\u2019re ready for the next adventure.`};
  const note=ph==='before'?t.message:ph==='during'?(t.messageDuring||DEF.during):(t.messageAfter||DEF.after);
  if(note)h+=`<div class="card"><p class="note serif" style="font-size:20px;margin:0">${esc(note)}</p><div class="sig script foil">${esc((A.name||'').split(' ')[0])}</div></div>`;
  const tr=t.travelers||[];
  if(tr.length){
    const N=num(t.days,1);
    let g=`<div class="dh"></div>`;for(let d=1;d<=N;d++)g+=`<div class="dh">${d}</div>`;
    tr.forEach((x,i)=>{g+=`<div class="lab">${esc(x.label)}<small>${num(x.count,0)} ${num(x.count,0)===1?'guest':'guests'}</small></div><div class="seg s${i%4+1}" style="grid-column:${num(x.from,1)+1}/${Math.min(num(x.to,N),N)+2}" title="${esc(x.who)}"></div>`});
    g+=`<div class="lab"><b>Total</b></div>`;for(let d=1;d<=N;d++)g+=`<div class="tot">${tr.filter(x=>x.from<=d&&d<=x.to).reduce((s,x)=>s+num(x.count,0),0)}</div>`;
    h+=`<div class="card"><h2>Who’s traveling</h2><div class="sm mute">By day of the trip</div><div class="tl" style="grid-template-columns:minmax(64px,120px) repeat(${N},minmax(0,1fr))">${g}</div></div>`;
  }
  const next=(t.bookings||[]).filter(b=>b.type==='flight').sort((a,b)=>num(a.from,0)-num(b.from,0)||byTime(a,b));
  if(next.length&&ph==='before'){const b=next[0];h+=`<div class="card"><h2>First up</h2><b>${esc(b.title)}</b><div class="mute">Day ${b.from}${dayDate(t,b.from)?' · '+fmt(dayDate(t,b.from)):''}${b.time?' · '+t12(b.time):''}${b.provider?' · '+esc(b.provider):''}</div><div class="btns"><a class="btn" href="#travel">All travel details</a></div></div>`}
  return h+advisorCard();
}
const stayOn=(t,d)=>(t.bookings||[]).find(b=>(b.type==='stay'||b.type==='cruise')&&num(b.from,0)<=d&&d<num(b.to,0));

function itinerary(t,ph){
  const N=num(t.days,1), today=ph==='during'?todayN(t):0;let h='';
  for(let d=1;d<=N;d++){
    const items=((t.plan||{})[d]||[]).slice().sort(byTime), stay=stayOn(t,d), dt=dayDate(t,d);
    const bk=(t.bookings||[]).filter(b=>num(b.from,0)===d&&!BTYPES[b.type]?.span).sort(byTime);
    const who=(t.travelers||[]).filter(x=>x.from<=d&&d<=x.to);
    const arrive=(t.travelers||[]).filter(x=>num(x.from,0)===d&&d>1), leave=(t.travelers||[]).filter(x=>num(x.to,0)===d&&d<N);
    h+=`<div class="card day${d===today?' today':''}" id="d${d}"><div class="dhd"><h2 style="margin:0">Day ${d}</h2><span class="mute">${dt?fmt(dt,{weekday:'long',month:'long',day:'numeric'}):''}</span></div>
    <div class="chips">${who.map(x=>`<span class="chip">${esc(x.label)}</span>`).join('')}</div>
    ${arrive.map(x=>`<div class="sm" style="color:var(--goldInk)">${esc(x.label)} arrive today</div>`).join('')}${leave.map(x=>`<div class="sm mute">${esc(x.label)} head home after today</div>`).join('')}
    <ul class="plan">${bk.map(b=>`<li><span class="t">${t12(b.time)||''}</span><span><b>${esc(BTYPES[b.type]?.one||'')}:</b> ${esc(b.title)}</span></li>`).join('')}${items.map(i=>`<li><span class="t">${t12(i.time)||'Any time'}</span><span>${esc(i.text)}</span></li>`).join('')}</ul>
    ${!bk.length&&!items.length?'<p class="mute sm" style="margin:6px 0 0">Nothing scheduled. Rest, explore, or ask your advisor for ideas.</p>':''}
    ${stay&&d<N?`<p class="sm mute" style="margin:10px 0 0">Tonight: ${esc(stay.title)}</p>`:''}</div>`;
  }
  return h;
}

function travel(t){
  let h=advisorCard();
  Object.entries(BTYPES).forEach(([k,T])=>{
    const list=(t.bookings||[]).filter(b=>b.type===k).sort((a,b)=>num(a.from,0)-num(b.from,0)||byTime(a,b));if(!list.length)return;
    h+=`<h2 style="margin-top:22px">${T.many}</h2>`+list.map(b=>{
      const a=num(b.from,0),z=num(b.to,0),da=a&&dayDate(t,a),dz=z&&dayDate(t,z);
      const when=!a?'':T.span?`${T.from}: ${da?fmt(da):'day '+a}${b.time?', '+t12(b.time):''} · ${T.to}: ${dz?fmt(dz):'day '+(z||'?')}`:`${da?fmt(da,{weekday:'long',month:'short',day:'numeric'}):'Day '+a}${b.time?' · '+t12(b.time):''}`;
      return `<div class="card bk"><div class="ic"><svg viewBox="0 0 24 24">${T.icon}</svg></div><div>
      <div class="serif" style="font-size:21px;font-weight:600;line-height:1.15">${esc(b.title)}</div>
      ${b.provider?`<div>${esc(b.provider)}</div>`:''}<div class="mute sm">${when}</div>
      ${b.conf?`<div class="conf"><span class="sm mute">Confirmation</span><b>${esc(b.conf)}</b><button data-copy="${esc(b.conf)}">Copy</button></div>`:''}
      ${b.notes?`<p class="note sm" style="margin:8px 0 0">${esc(b.notes)}</p>`:''}
      <div class="lk">${b.phone?`<a href="tel:${esc(b.phone)}">Call ${esc(b.phone)}</a>`:''}${b.addr?`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.addr)}" target="_blank" rel="noopener">Directions</a>`:''}${b.link?`<a href="${esc(/^https?:/.test(b.link)?b.link:'https://'+b.link)}" target="_blank" rel="noopener">Open booking</a>`:''}</div>
      </div></div>`}).join('');
  });
  if(!(t.bookings||[]).length)h+=`<div class="card mute">Your travel details will appear here as they’re booked.</div>`;
  return h;
}

function packing(t){
  const items=t.packing||[], lists=[...new Set(items.map(i=>i.list))];
  const done=items.filter(i=>ticks[i.id]).length, pct=items.length?Math.round(done/items.length*100):0;
  let h=`<div class="card"><div class="dhd"><h2 style="margin:0">Packing list</h2><span class="mute">${done} of ${items.length}</span></div><div class="prog"><i style="width:${pct}%"></i></div><p class="sm mute" style="margin:4px 0 0">${DEMO?'Ticks save on this device in the preview.':'Everyone with this link sees the same ticks.'}</p></div>`;
  lists.forEach(l=>{h+=`<div class="card"><h3 style="margin-top:0">${esc(l)}</h3><ul class="pk">${items.filter(i=>i.list===l).map(i=>`<li><label><input type="checkbox" data-pk="${esc(i.id)}"${ticks[i.id]?' checked':''}><span class="${ticks[i.id]?'done':''}">${esc(i.text)}</span></label></li>`).join('')}</ul></div>`});
  return h;
}

function review(t){
  const first=(A.name||'').split(' ')[0]||'your advisor';
  const starRow=(n,interactive)=>`<div class="stars"${interactive?' role="radiogroup" aria-label="Rating"':''}>${[1,2,3,4,5].map(i=>interactive?`<button type="button" data-star="${i}" class="${i<=n?'on':''}" aria-label="${i} star${i>1?'s':''}">★</button>`:`<span style="font-size:30px;color:${i<=n?'var(--gold)':'rgba(216,185,108,.3)'}">★</span>`).join('')}</div>`;
  let h='';
  if(myReview){
    h+=`<div class="card cdwrap"><div class="big foil" style="font-size:42px">Thank you</div>${starRow(myReview.stars)}<p style="color:#c9c4d9;margin:6px 0 0">${esc(first)} has your review. It means the world to a small business.</p></div>
    ${myReview.text?`<div class="card"><p class="quote" style="margin:0">“${esc(myReview.text)}”</p>${myReview.name?`<p class="mute sm" style="margin:8px 0 0">${esc(myReview.name)}</p>`:''}</div>`:''}`;
    if(A.reviewUrl&&myReview.stars>=4)h+=`<div class="card"><h2>Would you post it on Google too?</h2><p>It helps other families find ${esc(first)}. Tap below to copy your words, then paste them in.</p><div class="btns"><button class="btn gold" data-share-review>Copy & open Google</button></div></div>`;
    h+=`<div class="card"><div class="dhd"><span>Want to change something?</span><button class="btn" data-edit-review>Edit review</button></div></div>`;
  }else{
    if(!draftStars)draftStars=0;
    h+=`<div class="card cdwrap"><div class="big foil" style="font-size:42px">How was it?</div><p style="color:#c9c4d9;margin:8px 0 0">Tap to rate your trip with ${esc(first)}.</p>${starRow(draftStars,true)}</div>
    <form class="card rvf" id="rvf"><h2>Tell ${esc(first)} about it</h2>
      <label>What was the best part of your trip?<textarea name="text" placeholder="The moment the kids saw the castle…"></textarea></label>
      <label>Your name, as you’d like it shown<input name="name" value="${esc(t.client||'')}" autocomplete="name"></label>
      <div class="btns"><button class="btn gold" style="flex:1">Send review</button></div><p class="err" id="rverr" style="color:#b3402a" hidden></p></form>`;
  }
  h+=`<div class="card"><h2>Planning the next one?</h2><p>${esc(first)} can start on your next trip whenever you’re ready.</p><div class="btns">${A.website?`<a class="btn" href="${esc(A.website)}" target="_blank" rel="noopener">Visit ${esc(A.business)}</a>`:''}${A.whatsapp?`<a class="btn" href="https://wa.me/${esc(A.whatsapp)}">Message ${esc(first)}</a>`:''}</div></div>`;
  return h;
}
async function submitReview(f){
  const err=$('#rverr');err.hidden=true;
  if(!draftStars){err.textContent='Tap the stars to choose a rating first.';err.hidden=false;return}
  const rv={stars:draftStars,text:f.text.value.trim(),name:f.name.value.trim()};
  const btn=f.querySelector('button.gold');btn.disabled=true;btn.textContent='Sending…';
  if(DEMO){myReview={...rv,date:new Date().toISOString()};ls.set('aw-review-'+(trip.id||'demo'),myReview);render();scrollTo(0,0);return}
  try{const j=await api({action:'review',id,pin,review:rv});myReview=j.review;render();scrollTo(0,0)}
  catch(e){btn.disabled=false;btn.textContent='Send review';err.textContent='That didn’t send. Check your connection and try again.';err.hidden=false}
}

/* ---------- weather (Open-Meteo, free, no key) ---------- */
const WMO=c=>c==null?'':c===0?'Clear':c<=2?'Partly cloudy':c===3?'Cloudy':c<=48?'Fog':c<=57?'Drizzle':c<=67?'Rain':c<=77?'Snow':c<=82?'Showers':c<=86?'Snow showers':'Storms';
function weather(t){
  return `<div class="card"><h2>${esc(t.dest||'Weather')}</h2><div id="wx"><p class="mute">Loading weather…</p></div>
  ${t.dest?`<div class="btns"><a class="btn" href="https://www.google.com/search?q=${encodeURIComponent('10 day weather '+t.dest)}" target="_blank" rel="noopener">Full forecast</a></div>`:''}</div>`;
}
async function loadWeather(t){
  const box=$('#wx');if(!box)return;
  const s=parseD(t.start);
  if(!t.dest||!s){box.innerHTML='<p class="mute">Weather appears once your destination and dates are set.</p>';return}
  const key=t.dest+t.start+t.days;
  try{
    if(!wxCache[key]){
      const g=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&name=${encodeURIComponent(t.dest.split(',')[0].trim())}`)).json();
      const p=g.results&&g.results[0];if(!p)throw new Error('place');
      const today=new Date();today.setHours(0,0,0,0);
      const e=dayDate(t,num(t.days,1)), lastFc=new Date(today);lastFc.setDate(lastFc.getDate()+15);
      let rows=[], mode;
      if(s<=lastFc&&e>=today){
        mode='forecast';const a=s<today?today:s, b=e>lastFc?lastFc:e;
        const f=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=auto&start_date=${iso(a)}&end_date=${iso(b)}`)).json();
        rows=f.daily.time.map((d,i)=>({d:parseD(d),hi:f.daily.temperature_2m_max[i],lo:f.daily.temperature_2m_min[i],x:WMO(f.daily.weather_code[i]),rain:f.daily.precipitation_probability_max[i]!=null?f.daily.precipitation_probability_max[i]+'%':''}));
      }else if(e>=today){
        mode='last';const a=new Date(s),b=new Date(e);a.setFullYear(a.getFullYear()-1);b.setFullYear(b.getFullYear()-1);
        const f=await (await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${p.latitude}&longitude=${p.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&temperature_unit=fahrenheit&precipitation_unit=inch&timezone=auto&start_date=${iso(a)}&end_date=${iso(b)}`)).json();
        rows=f.daily.time.map((d,i)=>{const dd=parseD(d);dd.setFullYear(dd.getFullYear()+1);return {d:dd,hi:f.daily.temperature_2m_max[i],lo:f.daily.temperature_2m_min[i],x:WMO(f.daily.weather_code[i]),rain:f.daily.precipitation_sum[i]>0.04?f.daily.precipitation_sum[i].toFixed(1)+'"':'dry'}});
      }else mode='past';
      wxCache[key]={mode,rows,place:`${p.name}${p.admin1?', '+p.admin1:''}`};
    }
    const w=wxCache[key];
    if(w.mode==='past'){box.innerHTML='<p class="mute">This trip is over. Welcome home!</p>';return}
    const hi=w.rows.map(r=>r.hi).filter(v=>v!=null), lo=w.rows.map(r=>r.lo).filter(v=>v!=null);
    const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):'–';
    const mn=Math.min(...lo,40),mx=Math.max(...hi,90),x=v=>(v-mn)/(mx-mn)*100;
    box.innerHTML=`<p class="mute sm" style="margin-top:-4px">${w.mode==='forecast'?'Forecast for your dates':'What last year was like on your dates. The live forecast takes over two weeks before you go.'} · ${esc(w.place)}</p>
    <div class="dhd" style="justify-content:flex-start;gap:26px;margin:6px 0 10px"><div><div class="big foil" style="font-size:46px">${avg(hi)}°</div><div class="sm mute">avg high</div></div><div><div class="big" style="font-size:46px">${avg(lo)}°</div><div class="sm mute">avg low</div></div></div>
    ${w.rows.map(r=>`<div class="wx"><span>${fmt(r.d)}<br><span class="sm mute">${esc(r.x)}</span></span><div class="rng"><i style="left:${x(r.lo)}%;right:${100-x(r.hi)}%"></i></div><span class="r">${Math.round(r.lo)}–${Math.round(r.hi)}°<br><span class="sm mute">${esc(r.rain)}</span></span></div>`).join('')}`;
  }catch(e){box.innerHTML='<p class="mute">Weather couldn’t load right now. Try the full forecast below.</p>'}
}

/* ---------- events ---------- */
window.addEventListener('hashchange',()=>{view=(location.hash||'#overview').slice(1);if(trip){render();scrollTo(0,0)}});
document.addEventListener('submit',e=>{if(e.target.id==='rvf'){e.preventDefault();submitReview(e.target)}});
document.addEventListener('click',e=>{
  const st=e.target.closest('[data-star]');
  if(st){draftStars=+st.dataset.star;document.querySelectorAll('[data-star]').forEach(b=>b.classList.toggle('on',+b.dataset.star<=draftStars));return}
  if(e.target.closest('[data-edit-review]')){draftStars=myReview.stars;const keep=myReview;myReview=null;render();const f=$('#rvf');if(f){f.text.value=keep.text||'';f.name.value=keep.name||''}return}
  if(e.target.closest('[data-share-review]')){const txt=myReview.text||'';(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).catch(()=>{}).finally(()=>{location.href=A.reviewUrl});return}
  const c=e.target.closest('[data-copy]');
  if(c){navigator.clipboard?.writeText(c.dataset.copy).then(()=>{c.textContent='Copied'},()=>{c.textContent='Hold to copy'})}
});
document.addEventListener('change',async e=>{
  const k=e.target.dataset.pk;if(!k)return;const on=e.target.checked;
  if(on)ticks[k]=true;else delete ticks[k];
  e.target.nextElementSibling.classList.toggle('done',on);
  const items=trip.packing||[],done=items.filter(i=>ticks[i.id]).length;
  const p=$('.prog i');if(p)p.style.width=(items.length?done/items.length*100:0)+'%';
  const m=$('.card .dhd .mute');if(m)m.textContent=`${done} of ${items.length}`;
  if(DEMO){ls.set('aw-ticks-'+(trip.id||'demo'),ticks);return}
  ls.set('aw-ticks-'+id,ticks);
  try{const j=await api({action:'tick',id,pin,item:k,done:on});ticks=j.ticks||ticks}catch(err){}
});
function demoBar(){
  const d=$('#demo');d.hidden=false;
  const draw=()=>{d.innerHTML=`<span>Preview</span>${['before','during','after'].map(p=>`<button data-ph="${p}" class="${(forced||phase(trip))===p?'on':''}">${p[0].toUpperCase()+p.slice(1)}</button>`).join('')}<a href="builder.html" style="color:var(--gold2);padding:0 10px;font-size:13px">Builder</a>`};
  d.addEventListener('click',e=>{const b=e.target.closest('[data-ph]');if(!b)return;forced=b.dataset.ph;if(forced!=='after'&&view==='review')location.hash='#overview';draw();render()});
  draw();
}
load();
}
</script>
